<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاضلة الفرع العلمي </title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --primary-color: #1e7e34;
            --secondary-color: #28a745;
            --bg-body: #e9ecef;
            --bg-card: #ffffff;
            --text-main: #333333;
            --text-title: #111111;
            --border-color: #dee2e6;
        }
        [data-theme="dark"] {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #dddddd;
            --text-title: #ffffff;
            --border-color: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; position: relative; }
        .theme-toggle-btn {
            position: absolute; top: 40px; left: 30px;
            background: var(--bg-card); border: 2px solid var(--border-color);
            color: var(--text-main); padding: 8px 12px; border-radius: 20px;
            cursor: pointer; font-weight: bold; z-index: 10;
        }
        .main-card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: var(--bg-card); padding: 30px; margin-top: 30px; }
        .text-center { text-align: center; }
        .mb-4 { margin-bottom: 1.5rem; }
        .mb-3 { margin-bottom: 1rem; }
        .form-label { display: block; margin-bottom: .5rem; font-weight: bold; }
        .form-control, .form-select { display: block; width: 100%; padding: .5rem; font-size: 1.1rem; background-color: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); border-radius: .25rem; text-align: center; outline: none; }
        .btn-analyze { display: block; width: 100%; background-color: var(--primary-color); color: white; border: none; padding: 14px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn-analyze:hover { background-color: #155d27; }
        .faculty-card { background: var(--bg-card); border-right: 5px solid var(--secondary-color); border-left: 1px solid var(--border-color); border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); border-radius: 8px; padding: 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .loader-container { display: none; text-align: center; margin: 20px 0; }
        .spinner { display: inline-block; width: 2rem; height: 2rem; border: .25em solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .75s linear infinite; color: var(--primary-color); }
        @keyframes spin { to { transform: rotate(360deg); } }
        .search-box { display: none; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">مظلم</button>

    <div class="main-card">
        <div class="text-center mb-4">
            <h2 style="color: var(--primary-color);" class="mb-2">مفاضلة الفرع العلمي </h2>
            <h6 style="color: #6c757d;">العام الدراسي: 2026 / 2027</h6>
        </div>

        <form onsubmit="processAnalysis(event)">
            <div class="mb-3">
                <label class="form-label"> أدخل مجموعك (%):</label>
                <input type="number" step="0.01" id="scoreInput" class="form-control" placeholder="مثال: 72" required>
            </div>

            <div class="mb-4">
                <label class="form-label">نوع المفاضلة:</label>
                <select id="typeSelect" class="form-select">
                    <option value="all">كل الأنواع </option>
                    <option value="عام">مفاضلة عامة</option>
                    <option value="موازي">مفاضلة التعليم الموازي</option>
                </select>
            </div>

            <button type="submit" class="btn-analyze">تحليل الدرجات وعرض الأفرع المتاحة ✨</button>
        </form>

        <div class="loader-container" id="loader">
            <div class="spinner"></div>
            <p style="margin-top: 10px;">جاري فرز النتائج المتوافقة...</p>
        </div>

        <div class="search-box" id="searchBoxContainer">
            <div id="resultsCount" style="font-weight: bold; margin-bottom: 15px; color: var(--primary-color);"></div>
            <div id="resultsWrapper"></div>
        </div>
    </div>
</div>

<script>
    function toggleTheme() {
        const body = document.documentElement;
        const btn = document.getElementById('themeBtn');
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            btn.innerText = 'مظلم';
        } else {
            body.setAttribute('data-theme', 'dark');
            btn.innerText = 'مشرق';
        }
    }

    function processAnalysis(e) {
        e.preventDefault();
        const score = document.getElementById('scoreInput').value;
        const type = document.getElementById('typeSelect').value;
        const loader = document.getElementById('loader');
        const searchBox = document.getElementById('searchBoxContainer');
        const wrapper = document.getElementById('resultsWrapper');
        
        loader.style.display = 'block';
        searchBox.style.display = 'none';
        wrapper.innerHTML = '';

        fetch(`/api/search?score=${score}&type=${type}`)
            .then(res => res.json())
            .then(response => {
                loader.style.display = 'none';
                searchBox.style.display = 'block';
                
                if (response.status === 'success' && response.data.length > 0) {
                    document.getElementById('resultsCount').innerText = `عدد الأفرع المتاحة لك: ${response.data.length}`;
                    response.data.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'faculty-card';
                        card.innerHTML = `
                            <div>
                                <h3 style="color:var(--text-title); font-size:1.1rem;">${item.faculty}</h3>
                                <small style="color:#6c757d;">🏢 ${item.university} | 📋 ${item.type}</small>
                            </div>
                            <div style="font-weight:bold; color:var(--primary-color); font-size:1.3rem;">%${item.min_score}</div>
                        `;
                        wrapper.appendChild(card);
                    });
                } else {
                    document.getElementById('resultsCount').innerText = '';
                    wrapper.innerHTML = `<div style="text-align:center; color:#856404; padding:15px; background:#fff3cd; border-radius:5px;">لم نجد نتائج متوافقة مع هذا المجموع.</div>`;
                }
            })
            .catch(err => {
                loader.style.display = 'none';
                alert('حدث خطأ أثناء جلب البيانات من السيرفر.');
            });
    }
</script>
</body>
</html>
