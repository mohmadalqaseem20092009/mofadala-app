<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاضلة القبول الجامعي</title>
    <style>
        :root {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #e0e0e0;
            --text-title: #ffffff;
            --border-color: #2d2d2d;
            --input-bg: #121212;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            position: relative;
            margin-bottom: 24px;
        }

        .theme-toggle-btn {
            position: absolute;
            left: 0;
            top: 0;
            background-color: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            font-size: 11px;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(245, 158, 11, 0.2);
            cursor: pointer;
            font-weight: bold;
        }

        .header h1 {
            color: #10b981;
            font-size: 20px;
            margin: 0;
        }

        .header p {
            color: #888;
            font-size: 13px;
            margin: 4px 0 0 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            text-align: right;
        }

        .form-group input, .form-group select {
            width: 100%;
            box-sizing: border-box;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: #ffffff;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #10b981;
        }

        .analyze-btn {
            width: 100%;
            background-color: #059669;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 20px;
        }

        .analyze-btn:hover {
            background-color: #047857;
        }

        .wishes-container {
            border: 1px dashed #0284c7;
            background-color: rgba(2, 132, 199, 0.05);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .wishes-header {
            color: #38bdf8;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
            text-align: right;
        }

        .wish-row {
            background-color: var(--input-bg);
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .delete-btn {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            background-color: #059669;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .available-title {
            font-size: 14px;
            color: #888;
            margin: 20px 0 10px 0;
            text-align: right;
        }

        .branch-list {
            max-height: 260px;
            overflow-y: auto;
        }

        .branch-item {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .branch-details {
            text-align: right;
        }

        .branch-name {
            font-weight: bold;
            color: var(--text-title);
        }

        .branch-sub {
            color: #888;
            font-size: 11px;
            margin-top: 2px;
        }

        .branch-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .min-score {
            color: #10b981;
            font-weight: bold;
        }

        .add-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .hidden { display: none !important; }

        .download-btn {
            display: inline-block;
            background-color: #0284c7;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header">
            <button onclick="toggleTheme()" id="themeBtn" class="theme-toggle-btn">☀️ مشرق</button>
            <h1>مفاضلة القبول الجامعي</h1>
            <p>المهندس محمد القاسم</p>
        </div>

        <div class="form-group">
            <label>أدخل مجموعك المئوي (%):</label>
            <input type="text" id="studentScore" value="82">
        </div>

        <div class="form-group">
            <label>نوع المفاضلة:</label>
            <!-- تعديل المسميات لتتطابق برمجياً 100% مع شروط التصفية بداخل app.py -->
            <select id="competitionType">
                <option value="all" selected>كل المفاضلات</option>
                <option value="عام">مفاضلة عامة</option>
                <option value="موازي">مفاضلة التعليم الموازي</option>
            </select>
        </div>

        <button onclick="searchBranches()" class="analyze-btn">
            ✨ تحليل درجاتي وعرض الأفرع
        </button>

        <!-- صندوق الرغبات المختارة المنقط -->
        <div id="wishesBox" class="wishes-container hidden">
            <div class="wishes-header">📋 رغباتك المختارة:</div>
            <div id="selectedWishesList"></div>
            <button onclick="submitWishes()" class="submit-btn">تثبيت</button>
            <div id="downloadArea" class="hidden" style="text-align: center;"></div>
        </div>

        <div class="available-title">الأفرع المتاحة لمجموعك:</div>
        <div id="availableBranches" class="branch-list"></div>

    </div>

    <script>
        let selectedWishes = [];
        let isLight = false;

        function toggleTheme() {
            const btn = document.getElementById('themeBtn');
            isLight = !isLight;
            if (isLight) {
                document.body.style.backgroundColor = '#f3f4f6';
                document.body.style.color = '#1f2937';
                btn.innerHTML = '🌙 مظلم';
                document.querySelector('.container').style.backgroundColor = '#ffffff';
                document.querySelector('.container').style.borderColor = '#e5e7eb';
            } else {
                document.body.style.backgroundColor = '#121212';
                document.body.style.color = '#e0e0e0';
                btn.innerHTML = '☀️ مشرق';
                document.querySelector('.container').style.backgroundColor = '#1e1e1e';
                document.querySelector('.container').style.borderColor = '#2d2d2d';
            }
        }

        function cleanNumbers(str) {
            return str.replace(/[٠-٩]/g, function(d) {
                return d.charCodeAt(0) - 1632;
            });
        }

        async function searchBranches() {
            let scoreInput = document.getElementById('studentScore').value;
            scoreInput = cleanNumbers(scoreInput);
            const score = parseFloat(scoreInput);
            const type = document.getElementById('competitionType').value;
            
            const container = document.getElementById('availableBranches');
            container.innerHTML = '';

            if (isNaN(score)) {
                alert('الرجاء إدخال مجموع صحيح أولاً');
                return;
            }

            try {
                // إرسال الطلب بدقة وتوافق تام مع شروط الـ app.py الفعلي
                const response = await fetch(`/api/search?score=${score}&type=${type}`);
                const result = await response.json();
                
                if (result.status === 'success') {
                    let filtered = result.data.filter(branch => {
                        return !selectedWishes.some(w => w.faculty === branch.faculty && w.university === branch.university && w.type === branch.type);
                    });

                    if (filtered.length === 0) {
