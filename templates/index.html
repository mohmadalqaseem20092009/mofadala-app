<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاضلة القبول الجامعي</title>
    <style>
        :root {
            --primary-color: #1e7e34;
            --secondary-color: #28a745;
            --bg-body: #e9ecef;
            --bg-card: #ffffff;
            --text-main: #333333;
            --text-title: #111111;
            --border-color: #dee2e6;
        }
        [data-theme="dark"] {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #dddddd;
            --text-title: #ffffff;
            --border-color: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.2s ease, color 0.2s ease; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; position: relative; }
        
        .theme-toggle-btn {
            position: absolute; 
            top: 40px; 
            left: 30px;
            background: var(--bg-card); 
            border: 2px solid var(--border-color);
            color: var(--text-main); 
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        .theme-toggle-btn:hover {
            transform: scale(1.1);
            border-color: var(--secondary-color);
        }

        .main-card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: var(--bg-card); padding: 30px; margin-top: 30px; }
        .text-center { text-align: center; }
        .mb-4 { margin-bottom: 1.5rem; }
        .mb-3 { margin-bottom: 1rem; }
        .form-label { display: block; margin-bottom: .5rem; font-weight: bold; text-align: right; }
        .form-control, .form-select { display: block; width: 100%; padding: .6rem; font-size: 1.1rem; background-color: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); border-radius: .25rem; text-align: center; outline: none; }
        .btn-analyze { display: block; width: 100%; background-color: var(--primary-color); color: white; border: none; padding: 14px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn-analyze:hover { background-color: #155d27; }
        .faculty-card { background: var(--bg-card); border-right: 5px solid var(--secondary-color); border-left: 1px solid var(--border-color); border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); border-radius: 8px; padding: 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .loader-container { display: none; text-align: center; margin: 20px 0; }
        .spinner { display: inline-block; width: 2rem; height: 2rem; border: .25em solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .75s linear infinite; color: var(--primary-color); }
        @keyframes spin { to { transform: rotate(360deg); } }
        .search-box { display: none; margin-top: 20px; border-top: 2px solid var(--border-color); padding-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn" title="تبديل المظهر">
        🌙
    </button>

    <div class="main-card">
        <div class="text-center mb-4">
            <h2 style="color: var(--primary-color);" class="mb-2">مفاضلة القبول الجامعي</h2>
            <h6 style="color: #6c757d; margin-bottom: 5px;">العام الدراسي: 2026 / 2027</h6>
            <!-- إضافة اسمك بخط عريض تحت العام الدراسي مباشرة -->
            <h5 style="color: var(--text-main); font-weight: bold; margin-top: 5px;">المهندس محمد القاسم</h5>
        </div>

        <form onsubmit="processAnalysis(event)">
            <div class="mb-3">
                <label class="form-label">أدخل مجموعك المئوي الصافي (%):</label>
                <input type="number" step="0.01" id="scoreInput" class="form-control" placeholder="أدخل المجموع هنا..." required>
            </div>

            <div class="mb-4">
                <label class="form-label">نوع المفاضلة:</label>
                <select id="typeSelect" class="form-select">
                    <option value="all">كل الأنواع (عام + موازي)</option>
                    <option value="عام">مفاضلة عامة</option>
                    <option value="موازي">مفاضلة التعليم الموازي</option>
                </select>
            </div>

            <button type="submit" class="btn-analyze">تحليل درجاتي وعرض الأفرع المتاحة ✨</button>
        </form>

        <div class="loader-container" id="loader">
            <div class="spinner"></div>
            <p style="margin-top: 10px;">جاري فرز النتائج المتوافقة...</p>
        </div>

        <div class="search-box" id="searchBoxContainer">
            <input type="text" id="innerSearch" class="form-control" placeholder="تصفية فورية بالجامعة أو الكلية (مثال: دمشق، معلوماتية)..." onkeyup="filterResults()" style="margin-bottom: 15px; text-align: right; padding: 10px;">
            <div id="resultsCount" style="font-weight: bold; margin-bottom: 15px; color: var(--primary-color); text-align: right;"></div>
            <div id="resultsWrapper"></div>
        </div>
    </div>
</div>

<script>
    let rawData = [];

    window.addEventListener('DOMContentLoaded', () => {
        const body = document.documentElement;
        const btn = document.getElementById('themeBtn');
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            body.setAttribute('data-theme', 'dark');
            btn.innerText = '☀️';
        }
    });

    function toggleTheme() {
        const body = document.documentElement;
        const btn = document.getElementById('themeBtn');
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
            btn.innerText = '🌙';
        } else {
            body.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            btn.innerText = '☀️';
        }
    }

    function processAnalysis(e) {
        e.preventDefault();
        const score = document.getElementById('scoreInput').value;
        const type = document.getElementById('typeSelect').value;
        const loader = document.getElementById('loader');
        const searchBox = document.getElementById('searchBoxContainer');
        const wrapper = document.getElementById('resultsWrapper');
        
        loader.style.display = 'block';
        searchBox.style.display = 'none';
        wrapper.innerHTML = '';

        fetch(`/api/search?score=${score}&type=${type}`)
            .then(res => res.json())
            .then(response => {
                loader.style.display = 'none';
                searchBox.style.display = 'block';
                
                if (response.status === 'success' && response.data.length > 0) {
                    rawData = response.data;
                    renderCards(rawData);
                } else {
                    document.getElementById('resultsCount').innerText = '';
                    wrapper.innerHTML = `<div style="text-align:center; color:#856404; padding:15px; background:#fff3cd; border-radius:5px;">لم نجد نتائج متوافقة مع هذا المجموع.</div>`;
                }
            })
            .catch(err => {
                loader.style.display = 'none';
                alert('حدث خطأ أثناء جلب البيانات من السيرفر.');
            });
    }

    function renderCards(data) {
        const wrapper = document.getElementById('resultsWrapper');
        wrapper.innerHTML = '';
        document.getElementById('resultsCount').innerText = `عدد الأفرع المتاحة لك: ${data.length}`;
        
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'faculty-card';
            card.innerHTML = `
                <div style="text-align: right;">
                    <h3 style="color:var(--text-title); font-size:1.1rem; font-weight: bold; margin-bottom: 5px;">${item.faculty}</h3>
                    <small style="color:#6c757d;">🏢 ${item.university} | 📋 ${item.type}</small>
                </div>
                <div style="font-weight:bold; color:var(--primary-color); font-size:1.3rem;">%${item.min_score}</div>
            `;
            wrapper.appendChild(card);
        });
    }

    function filterResults() {
        const query = document.getElementById('innerSearch').value.toLowerCase().trim();
        const filtered = rawData.filter(item => 
            item.faculty.toLowerCase().includes(query) || 
            item.university.toLowerCase().includes(query)
        );
        renderCards(filtered);
    }
</script>
</body>
</html>
