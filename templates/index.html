<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاضلة القبول الجامعي</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .custom-card {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex justify-center items-start">

    <div class="w-full max-w-xl custom-card rounded-xl p-6 shadow-2xl space-y-6">
        
        <!-- الهيدر والعنوان الرئيسي -->
        <div class="text-center relative">
            <button onclick="toggleTheme()" id="themeBtn" class="absolute left-0 top-0 bg-amber-500/10 text-amber-400 text-xs px-2.5 py-1 rounded-full border border-amber-500/20 flex items-center gap-1 font-bold">
                <span>☀️</span> <span id="themeText">مشرق</span>
            </button>
            <h1 class="text-xl font-bold text-emerald-400">مفاضلة القبول الجامعي</h1>
            <p class="text-sm text-gray-400 mt-1">المهندس محمد القاسم</p>
        </div>

        <!-- 1. حقل المعدل (المجموع المئوي) -->
        <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-300 text-right">أدخل مجموعك المئوي (%):</label>
            <input type="text" id="studentScore" value="73"
                   class="w-full bg-[#121212] border border-gray-700 rounded-lg p-3 text-center text-white focus:outline-none focus:border-emerald-500 text-xl font-bold">
        </div>

        <!-- 2. حقل نوع المفاضلة -->
        <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-300 text-right">نوع المفاضلة:</label>
            <select id="competitionType"
                    class="w-full bg-[#121212] border border-gray-700 rounded-lg p-3 text-center text-white focus:outline-none focus:border-emerald-500 text-base">
                <option value="all">كل المفاضلات (عام وموازي)</option>
                <option value="عام">علمي عام</option>
                <option value="موازي" selected>علمي موازي</option>
            </select>
        </div>

        <!-- 3. زر تحليل الدرجات والبحث الأخضر الكبير -->
        <button onclick="searchBranches()" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium p-3 rounded-lg transition duration-200 flex items-center justify-center gap-2 text-base">
            ✨ تحليل درجاتي وعرض الأفرع
        </button>

        <!-- صندوق الرغبات المختارة الأزرق المنقط -->
        <div id="wishesBox" class="border border-dashed border-sky-500/50 bg-sky-950/10 rounded-lg p-4 space-y-3 hidden">
            <div class="flex justify-between items-center text-sm text-sky-400 font-medium">
                <span>📋 رغباتك المختارة:</span>
            </div>
            
            <div id="selectedWishesList" class="space-y-2"></div>

            <button onclick="submitWishes()" 
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium p-3 rounded-lg transition duration-200 text-center">
                تثبيت
            </button>
            
            <div id="downloadArea" class="hidden text-center pt-2"></div>
        </div>

        <!-- قسم الفروع المتاحة حسب المجموع المستوردة من السيرفر -->
        <div class="space-y-3">
            <h3 class="text-sm font-medium text-gray-500 text-right">الأفرع المتاحة لمجموعك:</h3>
            <div id="availableBranches" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <!-- الفروع تظهر هنا تلقائياً عند الضغط على تحليل -->
            </div>
        </div>

    </div>

    <script>
        let selectedWishes = [];
        let isLight = false;

        function toggleTheme() {
            const btn = document.getElementById('themeBtn');
            const txt = document.getElementById('themeText');
            isLight = !isLight;
            if (isLight) {
                document.body.style.backgroundColor = '#f3f4f6';
                document.body.style.color = '#1f2937';
                txt.innerText = 'مظلم';
                btn.className = 'absolute left-0 top-0 bg-gray-200 text-gray-800 text-xs px-2.5 py-1 rounded-full border border-gray-300 flex items-center gap-1 font-bold';
            } else {
                document.body.style.backgroundColor = '#121212';
                document.body.style.color = '#e0e0e0';
                txt.innerText = 'مشرق';
                btn.className = 'absolute left-0 top-0 bg-amber-500/10 text-amber-400 text-xs px-2.5 py-1 rounded-full border border-amber-500/20 flex items-center gap-1 font-bold';
            }
        }

        function cleanNumbers(str) {
            return str.replace(/[٠-٩]/g, function(d) {
                return d.charCodeAt(0) - 1632;
            });
        }

        async function searchBranches() {
            let scoreInput = document.getElementById('studentScore').value;
            scoreInput = cleanNumbers(scoreInput);
            const score = parseFloat(scoreInput);
            const type = document.getElementById('competitionType').value;
            
            const container = document.getElementById('availableBranches');
            container.innerHTML = '';

            if (isNaN(score)) {
                alert('الرجاء إدخال مجموع صحيح أولاً');
                return;
            }

            try {
                const response = await fetch(`/api/search?score=${score}&type=${type}`);
                const result = await response.json();
                
                if (result.status === 'success') {
                    let filtered = result.data.filter(branch => {
                        return !selectedWishes.some(w => w.faculty === branch.faculty && w.university === branch.university && w.type === branch.type);
                    });

                    if (filtered.length === 0) {
                        container.innerHTML = `<p class="text-xs text-amber-400 text-center py-4">لا توجد خيارات متاحة حالياً لمجموعك من السيرفر.</p>`;
                        return;
                    }

                    filtered.forEach(branch => {
                        const div = document.createElement('div');
                        div.className = 'bg-[#121212] border border-gray-800 rounded-lg p-3 flex justify-between items-center text-xs';
                        div.innerHTML = `
                            <div class="flex items-center gap-3">
                                <button onclick='addWish(${JSON.stringify(branch)})' 
                                        class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-3 py-1.5 rounded transition">
                                    + إضافة
                                </button>
                                <span class="text-emerald-400 font-semibold">%${branch.min_score}</span>
                            </div>
                            <div class="text-right">
                                <div class="font-bold text-gray-200">${branch.faculty}</div>
                                <div class="text-gray-400">${branch.university} | ${branch.type}</div>
                            </div>
                        `;
                        container.appendChild(div);
                    });
                }
            } catch (error) {
                console.error("Error connecting to server:", error);
            }
        }

        function addWish(branch) {
            selectedWishes.push(branch);
            updateWishesUI();
            searchBranches();
        }

        function removeWish(index) {
            selectedWishes.splice(index, 1);
            updateWishesUI();
            searchBranches();
        }

        function updateWishesUI() {
            const wishesBox = document.getElementById('wishesBox');
            const container = document.getElementById('selectedWishesList');
            container.innerHTML = '';

            if (selectedWishes.length > 0) {
                wishesBox.classList.remove('hidden');
            } else {
                wishesBox.classList.add('hidden');
                return;
            }

            selectedWishes.forEach((wish, index) => {
                const div = document.createElement('div');
                div.className = 'bg-[#121212] border border-gray-800 rounded p-3 flex justify-between items-center text-xs';
                div.innerHTML = `
                    <button onclick="removeWish(${index})" class="bg-red-600 hover:bg-red-500 text-white px-2 py-1 rounded text-[10px]">
                        حذف
                    </button>
                    <div class="text-gray-200 text-right">
                        ${wish.faculty} (${wish.type})
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function submitWishes() {
            const downloadArea = document.getElementById('downloadArea');
            if (selectedWishes.length === 0) return;

            try {
                const response = await fetch('/api/submit_wishes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_name: "طالب_المفاضلة", wishes: selectedWishes })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    downloadArea.classList.remove('hidden');
                    downloadArea.innerHTML = `
                        <a href="/download/${result.file_created}" class="inline-block bg-sky-600 hover:bg-sky-500 text-white text-xs font-medium py-2 px-4 rounded transition mt-2">
                            📥 تحميل ملف رغبات الطالب المصدّر
