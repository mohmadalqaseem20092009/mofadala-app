<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاضلة القبول الجامعي | المهندس محمد القاسم</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* كود التصميم الكلاسيكي الإجباري لضمان المظهر الداكن والألوان */
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #121212 !important;
            color: #ffffff !important;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        
        .main-card {
            background-color: #1e1e1e !important;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #2e2e2e;
            padding: 24px;
            box-sizing: border-box;
            position: relative;
        }

        .badge-mushriq {
            position: absolute;
            top: 16px;
            left: 16px;
            background-color: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 50px;
            font-weight: bold;
        }

        .header-title {
            text-align: center;
            margin-bottom: 24px;
            margin-top: 15px;
        }

        .header-title h1 {
            color: #10b981 !important; /* الأخضر الزيتي المضيء */
            font-size: 22px;
            margin: 0;
            font-weight: bold;
        }

        .header-title p {
            color: #a8a29e;
            font-size: 14px;
            margin: 4px 0 0 0;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #d6d3d1;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            background-color: #ffffff !important;
            color: #000000 !important;
            font-weight: bold;
            padding: 10px;
            border-radius: 12px;
            border: none;
            text-align: center;
            font-size: 18px;
            box-sizing: border-box;
        }

        .btn-analyze {
            width: 100%;
            background-color: #059669 !important; /* لون أخضر زيتي */
            color: white !important;
            font-weight: bold;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        }

        .btn-analyze:hover {
            background-color: #047857 !important;
        }

        .raghabat-box {
            border: 2px dashed rgba(30, 58, 138, 0.6);
            background-color: rgba(30, 58, 138, 0.1);
            border-radius: 12px;
            padding: 16px;
            margin-top: 24px;
            text-align: right;
        }

        .raghabat-title {
            color: #60a5fa;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .raghabat-item {
            background-color: #161616;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2e2e2e;
            margin-bottom: 12px;
        }

        .btn-delete {
            background-color: rgba(220, 38, 38, 0.2);
            color: #ef4444;
            border: 1px solid rgba(220, 38, 38, 0.4);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-delete:hover {
            background-color: #dc2626;
            color: white;
        }

        .btn-confirm {
            width: 100%;
            background-color: #059669 !important;
            color: white;
            font-weight: bold;
            padding: 8px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }

        .results-section {
            margin-top: 24px;
            text-align: right;
        }

        .results-title {
            font-size: 14px;
            color: #a8a29e;
            border-bottom: 1px solid #2e2e2e;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .branch-card {
            background-color: #242424;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2e2e2e;
            margin-bottom: 10px;
        }

        .btn-add {
            background-color: #2563eb !important; /* لون أزرق */
            color: white !important;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
        .btn-add:hover {
            background-color: #1d4ed8 !important;
        }

        .branch-score {
            color: #10b981;
            font-weight: bold;
            font-size: 14px;
            background-color: rgba(16, 185, 129, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
        }

        .branch-info {
            text-align: left;
        }

        .branch-name {
            font-weight: bold;
            font-size: 14px;
            color: #e7e5e4;
            margin: 0;
        }

        .branch-sub {
            font-size: 11px;
            color: #a8a29e;
            margin: 2px 0 0 0;
        }
    </style>
</head>
<body>

    <!-- الكرت أو الحاوية الداكنة المخصصة المماثلة للصورة -->
    <div class="main-card">
        
        <!-- علامة مشرق المضيئة -->
        <div class="badge-mushriq">
            <span style="color: #f59e0b;">●</span> مشرق
        </div>

        <!-- ترويسة العنوان -->
        <div class="header-title">
            <h1>مفاضلة القبول الجامعي</h1>
            <p>المهندس محمد القاسم</p>
        </div>

        <!-- فورم إدخال البيانات للتحليل ومطابق للصورة الأصلية تماماً -->
        <form id="mofadhalaForm">
            <div class="form-group">
                <label>اسم الطالب الثلاثي:</label>
                <input type="text" id="studentName" name="student_name" placeholder="محمد">
            </div>

            <div class="form-group">
                <label>أدخل مجموعك المئوي (%):</label>
                <input type="number" step="0.01" id="score" name="score" placeholder="73" required>
            </div>

            <button type="submit" class="btn-analyze">
                ✨ تحليل درجاتي وعرض الأفرع ✨
            </button>
        </form>

        <!-- صندوق الرغبات المختارة ذو الإطار المنقط الأزرق -->
        <div class="raghabat-box">
            <div class="raghabat-title">📋 رغباتك المختارة:</div>
            
            <div class="raghabat-item">
                <button class="btn-delete">حذف</button>
                <span style="font-size: 13px; font-weight: 500;">الهندسة المعمارية (موازي)</span>
            </div>

            <button class="btn-confirm">تثبيت الرغبات</button>
        </div>

        <!-- قسم عرض نتائج الفرز في الأسفل مع زر الإضافة الأزرق -->
        <div class="results-section">
            <div class="results-title">الأفرع والخيارات المتوافقة:</div>
            
            <div id="branchesContainer">
                <!-- عينة مسبقة للشكل الكلاسيكي للفرع قبل البحث لكي ترى الهيكل المماثل تماماً -->
                <div class="branch-card">
                    <button class="btn-add">+ إضافة</button>
                    <span class="branch-score">%72</span>
                    <div class="branch-info">
                        <h4 class="branch-name">الهندسة المعمارية</h4>
                        <p class="branch-sub">جامعة دمشق | موازي</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- كود الجافا سكريبت للربط مع الباك إند بايثون وتحليل البيانات ديناميكياً -->
    <script>
        document.getElementById('mofadhalaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            
            fetch('/analyze', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(res => {
                const container = document.getElementById('branchesContainer');
                container.innerHTML = '';
                
                if (res.status === 'success' && res.data.length > 0) {
                    res.data.forEach(branch => {
                        const card = `
                            <div class="branch-card">
                                <button class="btn-add">+ إضافة</button>
                                <span class="branch-score">%${branch.min_score}</span>
                                <div class="branch-info">
                                    <h4 class="branch-name">${branch.name}</h4>
                                    <p class="branch-sub">${branch.university} | ${branch.type}</p>
                                </div>
                            </div>
                        `;
                        container.innerHTML += card;
                    });
