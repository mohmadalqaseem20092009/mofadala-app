<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاضلة القبول الجامعي</title>
    <style>
        :root { --bg-body: #e9ecef; --bg-card: #ffffff; --text-main: #333333; --primary: #1e7e34; }
        [data-theme="dark"] { --bg-body: #121212; --bg-card: #1e1e1e; --text-main: #dddddd; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: var(--bg-body); color: var(--text-main); padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; background: var(--bg-card); padding: 30px; border-radius: 12px; position: relative; margin-top: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .theme-btn { position: absolute; top: 15px; left: 15px; padding: 8px 12px; border-radius: 20px; cursor: pointer; border: 1px solid #ccc; background: var(--bg-card); color: var(--text-main); font-weight: bold; }
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-control { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; text-align: center; font-size: 1.1rem; }
        .btn-go { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .wishlist { display: none; margin-top: 20px; padding: 15px; border: 2px dashed #007bff; background: rgba(0,123,255,0.05); border-radius: 8px; text-align: right; }
        .wish-item { display: flex; justify-content: space-between; background: var(--bg-body); padding: 8px; margin-bottom: 5px; border-radius: 4px; }
        .btn-del { background: #dc3545; color: white; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
        .card { background: var(--bg-body); padding: 15px; margin-top: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; text-align: right; }
        .btn-add { background: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 مظلم</button>
    
    <h2 style="color: var(--primary); margin-bottom: 5px;">مفاضلة القبول الجامعي</h2>
    <h4 style="margin-bottom: 20px;">المهندس محمد القاسم</h4>

    <div class="form-group">
        <label>اسم الطالب الثلاثي:</label>
        <input type="text" id="studentName" class="form-control" placeholder="اكتب اسم الطالب هنا...">
    </div>

    <div class="form-group">
        <label>أدخل مجموعك المئوي (%):</label>
        <input type="number" step="0.1" id="studentScore" class="form-control" placeholder="مثال: 80">
    </div>

    <button class="btn-go" onclick="runAnalysis()">تحليل درجاتي وعرض الأفرع ✨</button>

    <div class="wishlist" id="wishlistSection">
        <h4 style="color: #007bff; margin-bottom: 10px;">📋 رغباتك المختارة:</h4>
        <div id="wishlistItems"></div>
        <button class="btn-go" style="background: #28a745;" onclick="sendToExcel()">تثبيت وإرسال ملف Excel 🚀</button>
    </div>

    <div id="resultsWrapper" style="margin-top: 20px;"></div>
</div>

<script>
    var db = [
        {"faculty": "السنة التحضيرية الطبية", "university": "جميع الجامعات", "min": 94.5, "type": "عام"},
        {"faculty": "السنة التحضيرية الطبية", "university": "جميع الجامعات", "min": 92.0, "type": "موازي"},
        {"faculty": "الهندسة المعلوماتية", "university": "جامعة دمشق", "min": 85.0, "type": "عام"},
        {"faculty": "الهندسة المعلوماتية", "university": "جامعة دمشق", "min": 80.0, "type": "موازي"},
        {"faculty": "الهندسة المعلوماتية", "university": "جامعة حلب", "min": 84.0, "type": "عام"},
        {"faculty": "الهندسة المعلوماتية", "university": "جامعة حلب", "min": 79.0, "type": "موازي"},
        {"faculty": "الهندسة الطبية", "university": "جامعة دمشق", "min": 80.0, "type": "عام"},
        {"faculty": "الهندسة الطبية", "university": "جامعة دمشق", "min": 77.0, "type": "موازي"},
        {"faculty": "الهندسة المعمارية", "university": "جامعة دمشق", "min": 75.0, "type": "عام"},
        {"faculty": "الهندسة المعمارية", "university": "جامعة دمشق", "min": 72.0, "type": "موازي"},
        {"faculty": "الهندسة المدنية", "university": "جامعة دمشق", "min": 80.0, "type": "عام"},
        {"faculty": "الهندسة المدنية", "university": "جامعة دمشق", "min": 74.0, "type": "موازي"},
        {"faculty": "هندسة الميكاترونيك", "university": "جامعة حلب", "min": 72.0, "type": "عام"},
        {"faculty": "هندسة الميكاترونيك", "university": "جامعة حلب", "min": 68.0, "type": "موازي"},
        {"faculty": "هندسة الهمك (ميكانيك/كهرباء)", "university": "جميع الجامعات", "min": 68.0, "type": "عام"},
        {"faculty": "هندسة الهمك (ميكانيك/كهرباء)", "university": "جميع الجامعات", "min": 64.0, "type": "موازي"},
        {"faculty": "كلية الاقتصاد", "university": "جامعة دمشق", "min": 68.0, "type": "عام"},
        {"faculty": "كلية الحقوق", "university": "جامعة دمشق", "min": 55.0, "type": "عام"}
    ];

    var currentResults = [];
    var wishes = [];

    function toggleTheme() {
        var el = document.documentElement;
        var btn = document.getElementById('themeBtn');
        if (el.getAttribute('data-theme') === 'dark') {
            el.removeAttribute('data-theme');
            btn.innerHTML = '🌙 مظلم';
        } else {
            el.setAttribute('data-theme', 'dark');
            btn.innerHTML = '☀️ مشرق';
        }
    }

    function runAnalysis() {
        var score = parseFloat(document.getElementById('studentScore').value) || 0;
        var wrapper = document.getElementById('resultsWrapper');
        wrapper.innerHTML = '';

        currentResults = db.filter(function(item) { return score >= item.min; });
        currentResults.sort(function(a,b) { return b.min - a.min; });

        if (currentResults.length === 0) {
            wrapper.innerHTML = '<div style="padding:10px; background:#fff3cd; border-radius:5px;">لم نجد نتائج متوافقة.</div>';
            return;
        }

        currentResults.forEach(function(item, idx) {
            var div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = '<div><strong>' + item.faculty + '</strong><br><small>' + item.university + ' | ' + item.type + '</small></div>' +
                            '<div style="display:flex; align-items:center; gap:10px;"><span style="font-weight:bold; color:#1e7e34;">%' + item.min + '</span>' +
                            '<button class="btn-add" onclick="addWish(' + idx + ')">+ إضافة</button></div>';
            wrapper.appendChild(div);
        });
    }

    function addWish(idx) {
        var item = currentResults[idx];
        if (wishes.some(function(w) { return w.faculty === item.faculty && w.type === item.type; })) {
            alert('مضاف مسبقاً!');
            return;
        }
        wishes.push(item);
        drawWishlist();
    }

    function delWish(idx) {
        wishes.splice(idx, 1);
        drawWishlist();
    }

    function drawWishlist() {
        var sec = document.getElementById('wishlistSection');
        var wrap = document.getElementById('wishlistItems');
        wrap.innerHTML = '';
        if (wishes.length > 0) {
            sec.style.display = 'block';
            wishes.forEach(function(item, idx) {
                var div = document.createElement('div');
                div.className = 'wish-item';
                div.innerHTML = '<div>' + item.faculty + ' (' + item.type + ')</div><button class="btn-del" onclick="delWish(' + idx + ')">حذف</button>';
                wrap.appendChild(div);
            });
        } else {
            sec.style.display = 'none';
        }
    }

    function sendToExcel() {
        var name = document.getElementById('studentName').value.trim();
        if (!name) { alert('ادخل اسم الطالب أولاً!'); return; }
        if (wishes.length === 0) { alert('السلة فارغة!'); return; }

        fetch('/api/submit_wishes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ student_name: name, wishes: wishes })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.status === 'success') {
                alert('تم الحفظ وتوليد ملف Excel بنجاح يا م/محمد!');
                wishes = []; drawWishlist();
            } else { alert('خطأ في الحفظ'); }
        }).catch(function() { alert('خطأ في الاتصال بالخادم'); });
    }
</script>
</body>
</html>
