<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الرغبات - مفاضلة القبول</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .custom-card {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
        }
        .tab-btn.active {
            border-bottom: 3px solid #06b6d4;
            color: #06b6d4;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex justify-center items-start">

    <div class="w-full max-w-2xl custom-card rounded-xl p-6 shadow-2xl space-y-6">
        
        <!-- الهيدر العلوي بنمط الوزارة الجديد -->
        <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-white">إدارة الرغبات</h1>
                <p class="text-xs text-gray-400 mt-1">أضف رغباتك، رتّبها حسب أولويتك، ثم ثبّتها عند الانتهاء.</p>
            </div>
            <!-- زر إلغاء التثبيت البرمجي الأحمر اللطيف في الأعلى -->
            <button id="lockStatusBtn" class="bg-red-950/30 border border-red-500/30 text-red-400 text-xs px-3 py-1.5 rounded-lg flex items-center gap-1">
                🔓 طلب إلغاء التثبيت
            </button>
        </div>

        <!-- حقول الاختيارات والتصفية الأساسية -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-[#151515] p-4 rounded-lg border border-gray-800">
            <div class="space-y-1">
                <label class="block text-xs text-gray-400">أدخل مجموعك المئوي (%):</label>
                <input type="number" id="studentScore" value="73" step="0.1" oninput="searchBranches()"
                       class="w-full bg-[#1e1e1e] border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-cyan-500 text-base font-bold text-center">
            </div>
            <div class="space-y-1">
                <label class="block text-xs text-gray-400">تحديد نوع المفاضلة:</label>
                <select id="competitionType" onchange="searchBranches()"
                        class="w-full bg-[#1e1e1e] border border-gray-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-cyan-500 text-sm">
                    <option value="all">كل المفاضلات (عام وموازي)</option>
                    <option value="عام">علمي عام</option>
                    <option value="موازي">علمي موازي</option>
                </select>
            </div>
        </div>

        <!-- أزرار التنقل بين الصفحات الداخلية (إضافة رغبة / رغباتي) -->
        <div class="flex border-b border-gray-800 text-sm font-medium">
            <button onclick="switchTab('search')" id="tabSearch" class="tab-btn active flex-1 py-3 text-center">➕ إضافة رغبة</button>
            <button onclick="switchTab('wishes')" id="tabWishes" class="tab-btn flex-1 py-3 text-center flex items-center justify-center gap-2">
                📋 رغباتي <span id="wishesBadge" class="bg-gray-800 text-gray-300 text-xs px-2 py-0.5 rounded-full">0</span>
            </button>
        </div>

        <!-- صفحة 1: إضافة رغبة (البحث والخيارات المتاحة) -->
        <div id="pageSearch" class="space-y-3">
            <div id="availableBranches" class="space-y-3 max-h-[400px] overflow-y-auto pr-1">
                <!-- الفروع تظهر هنا تلقائياً -->
            </div>
        </div>

        <!-- صفحة 2: رغباتي (الرغبات التي تم اختيارها وترتيبها مع زر التثبيت) -->
        <div id="pageWishes" class="space-y-4 hidden">
            <div id="selectedWishesList" class="space-y-3">
                <!-- الرغبات المضافة تظهر هنا بتصميم الوزارة -->
            </div>

            <!-- زر التثبيت النهائي المقفل الأحمر -->
            <div class="pt-4 border-t border-gray-800">
                <button onclick="submitWishes()" id="submitBtn"
                        class="w-full bg-red-700 hover:bg-red-600 text-white font-medium p-3 rounded-lg transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-red-900/20">
                    🔒 تثبيت الرغبات (إرسال إكسل)
                </button>
            </div>
            
            <div id="downloadArea" class="hidden text-center pt-2"></div>
        </div>

    </div>

    <script>
        let selectedWishes = [];

        // التحميل التلقائي الأول للفروع المتاحة عند فتح الصفحة
        window.onload = function() {
            searchBranches();
        };

        function switchTab(tab) {
            if (tab === 'search') {
                document.getElementById('pageSearch').classList.remove('hidden');
                document.getElementById('pageWishes').classList.add('hidden');
                document.getElementById('tabSearch').classList.add('active');
                document.getElementById('tabWishes').classList.remove('active');
            } else {
                document.getElementById('pageSearch').classList.add('hidden');
                document.getElementById('pageWishes').classList.remove('hidden');
                document.getElementById('tabSearch').classList.remove('active');
                document.getElementById('tabWishes').classList.add('active');
            }
        }

        async function searchBranches() {
            const score = document.getElementById('studentScore').value;
            const type = document.getElementById('competitionType').value;
            if (!score) return;

            try {
                const response = await fetch(`/api/search?score=${score}&type=${type}`);
                const result = await response.json();
                
                if (result.status === 'success') {
                    renderAvailableBranches(result.data);
                }
            } catch (error) {
                console.error(error);
            }
        }

        function renderAvailableBranches(branches) {
            const container = document.getElementById('availableBranches');
            container.innerHTML = '';

            // تصفية الفروع المضافة مسبقاً
            const filtered = branches.filter(b => !selectedWishes.some(w => w.faculty === b.faculty && w.type === b.type && w.university === b.university));

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500 text-center py-8">لا توجد خيارات متاحة مطابقة لمجموعك ونوع المفاضلة.</p>`;
                return;
            }

            filtered.forEach(branch => {
                const div = document.createElement('div');
                div.className = 'bg-[#1a1a1a] border border-gray-800 rounded-xl p-4 flex justify-between items-center transition hover:border-gray-700';
                div.innerHTML = `
                    <div class="space-y-1">
                        <div class="font-bold text-gray-100 text-sm">${branch.faculty} (${branch.university})</div>
                        <div class="text-xs text-gray-400">علمي ${branch.type} - شهادات سورية</div>
                        <div class="text-xs text-amber-500 font-medium">الحد الأدنى: %${branch.min_score}</div>
                    </div>
                    <button onclick='addWish(${JSON.stringify(branch)})' 
                            class="bg-cyan-700 hover:bg-cyan-600 text-white text-xs font-medium px-4 py-2 rounded-lg transition">
                        + إضافة رغبة
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function addWish(branch) {
            selectedWishes.push(branch);
            document.getElementById('wishesBadge').innerText = selectedWishes.length;
            updateWishesUI();
            searchBranches();
            switchTab('wishes'); // الذهاب تلقائياً لصفحة رغباتي عند الضغط على إضافة
        }

        function removeWish(index) {
            selectedWishes.splice(index, 1);
            document.getElementById('wishesBadge').innerText = selectedWishes.length;
            updateWishesUI();
            searchBranches();
        }

        function updateWishesUI() {
            const container = document.getElementById('selectedWishesList');
            container.innerHTML = '';

            if (selectedWishes.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500 text-center py-8">لم تقم بإضافة أي رغبة حتى الآن.</p>`;
                return;
            }

            selectedWishes.forEach((wish, index) => {
                const div = document.createElement('div');
                div.className = 'bg-[#1a1a1a] border border-cyan-950 rounded-xl p-4 flex justify-between items-center relative';
                div.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="bg-cyan-950 text-cyan-400 w-7 h-7 rounded-lg flex items-center justify-center font-bold text-sm border border-cyan-800">
                            ${index + 1}
                        </div>
                        <div class="space-y-0.5">
                            <div class="font-bold text-white text-sm">${wish.faculty}</div>
                            <div class="text-xs text-gray-400">📍 ${wish.university}</div>
                            <div class="text-xs text-gray-400">علمي ${wish.type} - العام الحالي - شهادات سورية</div>
                        </div>
                    </div>
                    <button onclick="removeWish(${index})" class="text-red-400 hover:text-red-300 text-xs px-2 py-1 rounded">
                        حذف
                    </button>
                `;
                container.appendChild(div);
            });
        }

        async function submitWishes() {
            const downloadArea = document.getElementById('downloadArea');
