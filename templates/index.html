<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الفرز والمفاضلة الإلكترونية</title>
    <!-- تضمين أيقونات FontAwesome لمطابقة التصميم الوزاري -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* الألوان الرسمية للموقع الحكومي */
        :root {
            --bg-dark: #121212;
            --card-bg: #1c1c1e;
            --primary-green: #0a4d34;
            --accent-green: #11704b;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #2c2c2e;
            --badge-bg: #2d1c1c;
            --badge-text: #f8d7da;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            direction: rtl;
            padding: 20px;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        /* شريط التحكم العلوي المتطابق مع الصورة */
        .top-filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .search-wrapper { position: relative; flex: 1; }
        .search-wrapper i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        
        .form-control, .form-select {
            width: 100%; padding: 10px 40px 10px 15px;
            font-size: 0.95rem; color: var(--text-main);
            background-color: #2c2c2e; border: 1px solid var(--border-color);
            border-radius: 6px; outline: none;
        }
        .form-select { padding: 10px 15px; text-align: right; }

        .btn-analyze {
            background-color: var(--primary-green); color: white; border: none;
            padding: 10px 25px; border-radius: 6px; cursor: pointer;
            font-weight: bold; transition: background 0.2s;
        }
        .btn-analyze:hover { background-color: var(--accent-green); }

        /* التبويب الملون الرئيسي (علمي عام - العام الحالي) */
        .category-header {
            background-color: var(--primary-green);
            padding: 12px 20px;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            margin-top: 10px;
        }
        .category-count { background: rgba(255,255,255,0.2); padding: 2px 10px; border-radius: 12px; font-size: 0.85rem; }

        /* حاوية البطاقات الكبيرة */
        .results-panel {
            background-color: #171719;
            padding: 15px;
            border-radius: 0 0 8px 8px;
            border: 1px solid var(--border-color);
            border-top: none;
        }

        /* تصميم كرت الرغبة مطابق تماماً للصورة */
        .faculty-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .faculty-card:hover { transform: translateY(-2px); border-color: var(--accent-green); }

        .card-right { display: flex; align-items: center; gap: 20px; }
        .plus-icon { color: var(--accent-green); font-size: 1.2rem; cursor: pointer; }
        
        .faculty-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; color: #ffffff; }
        .location-info { color: var(--text-muted); font-size: 0.9rem; display: flex; align-items: center; gap: 5px; }

        .card-left { text-align: left; }
        .score-badge {
            background-color: var(--badge-bg);
            color: #ff8585;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
        }

        /* شريط التحميل الدوار */
        .loader {
            display: none; text-align: center; padding: 30px;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #2c2c2e;
            border-top-color: var(--accent-green); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* النافذة المنبثقة للشروط */
        .custom-modal {
            display: none; position: fixed; z-index: 2000;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7); align-items: center; justify-content: center;
        }
        .modal-content {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 10px; max-width: 500px; width: 90%; overflow: hidden;
        }
        .modal-header { background: var(--primary-green); color: white; padding: 15px; position: relative; font-weight: bold; }
        .modal-body { padding: 20px; line-height: 1.6; color: #dddddd; }
        .modal-footer { padding: 15px; background: #171719; display: flex; justify-content: flex-end; border-top: 1px solid var(--border-color); }
        .btn-close { position: absolute; left: 15px; top: 15px; background: transparent; border: none; color: white; font-size: 22px; cursor: pointer; }
        .btn-secondary { background: #48484a; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .conditions-box { background: #2d2212; border: 1px solid #ff9f0a; color: #ff9f0a; padding: 12px; border-radius: 6px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- شريط التحكم والإدخال العلوي الموحد -->
    <form id="analyzeForm" onsubmit="processAnalysis(event)" class="top-filter-bar">
        <div style="width: 180px;">
            <input type="number" step="0.01" min="50" max="100" class="form-control" id="scoreInput" placeholder="أدخل النسبة المئوية..." required style="padding-right:15px; text-align:center;">
        </div>
        <div style="width: 200px;">
            <select class="form-select" id="typeSelect">
                <option value="all">جميع الأنواع</option>
                <option value="عام">مفاضلة عامة</option>
                <option value="موازي">مفاضلة موازي</option>
            </select>
        </div>
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="innerSearch" class="form-control" placeholder="ابحث باسم الرغبة أو الجامعة..." onkeyup="filterResults()">
        </div>
        <button type="submit" class="btn-analyze">تحديث النتائج</button>
    </form>

    <!-- شريط التحميل الاستباقي -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p style="color: var(--text-muted);">جاري تصفية وفرز الرغبات المتاحة لدرجاتك...</p>
    </div>

    <!-- التبويب الملون والنتائج -->
    <div id="mainResultsContainer" style="display: none;">
        <div class="category-header">
            <div>
                <i class="fa-solid fa-chevron-down me-2" style="font-size: 0.85rem;"></i>
                علمي عام - العام الحالي شهادات سورية
            </div>
            <span class="category-count" id="resultsCount">0</span>
        </div>

        <div class="results-panel" id="resultsWrapper">
            <!-- سيتم حقن كروت الرغبات هنا ديناميكياً -->
        </div>
    </div>

</div>

<!-- النافذة المنبثقة للتفاصيل والشروط الإضافية الوزارية -->
<div class="custom-modal" id="infoModal">
    <div class="modal-content">
        <div class="modal-header">
            <span id="modalFacultyTitle">تفاصيل الرغبة</span>
            <button class="btn-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <p class="mb-3"><i class="fa-solid fa-building-columns text-muted me-2"></i> <strong>الجامعة / فرع:</strong> <span id="modalUniversity"></span></p>
            <p class="mb-3"><i class="fa-solid fa-id-card text-muted me-2"></i> <strong>نوع المفاضلة:</strong> <span id="modalType"></span></p>
            <p class="mb-3"><i class="fa-solid fa-chart-simple text-muted me-2"></i> <strong>الحد الأدنى المطلوب:</strong> <span id="modalMinScore"></span></p>
            <div class="conditions-box">
                <h5 style="font-size: 0.95rem; margin-bottom: 6px;"><i class="fa-solid fa-circle-exclamation me-1"></i> الشروط والملاحظات الخاصة بوزارة التعليم العالي:</h5>
                <p id="modalConditions" style="margin: 0; font-size: 0.88rem; line-height:1.4;"></p>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeModal()">إغلاق النافذة</button>
        </div>
    </div>
</div>

<script>
    let rawData = [];

    function processAnalysis(e) {
        e.preventDefault();
        const score = document.getElementById('scoreInput').value;
        const type = document.getElementById('typeSelect').value;
        const loader = document.getElementById('loader');
        const mainContainer = document.getElementById('mainResultsContainer');
        const resultsWrapper = document.getElementById('resultsWrapper');
        
        mainContainer.style.display = 'none';
        loader.style.display = 'block';

        let url = `/api/search?score=${score}`;
        if(type !== 'all') {
            url += `&type=${type === 'عام' ? 'مفاضلة عامة' : 'مفاضلة التعليم الموازي'}`;
        }

        fetch(url)
