<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاضلة القبول الجامعي | المهندس محمد القاسم</title>
    <!-- استدعاء Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-[#121212] text-white min-h-screen flex flex-col justify-center items-center p-4">

    <!-- الحاوية الرئيسية للتطبيق (تصميم داكن ممتد ومقوس الزوايا) -->
    <div class="bg-[#1e1e1e] w-full max-w-lg rounded-2xl shadow-2xl border border-stone-800 p-6 space-y-6 relative">
        
        <!-- زر التمييز العلوي (مثل "مشرق" الموجود في الصورة) -->
        <div class="absolute top-4 left-4">
            <span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-xs px-3 py-1 rounded-full font-bold flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> مشرق
            </span>
        </div>

        <!-- عنوان المفاضلة الرئيسي -->
        <div class="text-center pt-4">
            <h1 class="text-xl font-bold text-emerald-500">مفاضلة القبول الجامعي</h1>
            <p class="text-stone-400 text-sm mt-1">المهندس محمد القاسم</p>
        </div>

        <!-- نموذج إدخال البيانات -->
        <form id="mofadhalaForm" class="space-y-4">
            <!-- حقل اسم الطالب -->
            <div>
                <label class="block text-sm font-medium text-stone-300 mb-1.5">اسم الطالب الثلاثي:</label>
                <input type="text" id="studentName" name="student_name" placeholder="أدخل اسمك هنا"
                       class="w-full bg-white text-black font-bold px-4 py-2.5 rounded-xl border-none focus:ring-2 focus:ring-emerald-500 text-center text-lg">
            </div>

            <!-- حقل المعدل المئوي -->
            <div>
                <label class="block text-sm font-medium text-stone-300 mb-1.5">أدخل مجموعك المئوي (%):</label>
                <input type="number" step="0.01" id="score" name="score" placeholder="مثال: 73" required
                       class="w-full bg-white text-black font-bold px-4 py-2.5 rounded-xl border-none focus:ring-2 focus:ring-emerald-500 text-center text-lg">
            </div>

            <!-- زر التحليل الرئيسي الأخضر -->
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 text-base flex items-center justify-center gap-2 shadow-lg">
                <span>✨</span> تحليل درجاتي وعرض الأفرع <span>✨</span>
            </button>
        </form>

        <!-- صندوق الرغبات المختارة المستقبلي (محدد بإطار منقط أزرق) -->
        <div class="border-2 border-dashed border-blue-900/60 bg-blue-950/20 rounded-xl p-4 space-y-3">
            <div class="text-blue-400 text-sm font-bold flex items-center gap-1.5">
                <span>📋</span> رغباتك المختارة:
            </div>
            
            <!-- عينة لبطاقة رغبة مضافة داخل الصندوق مع زر الحذف الأحمر -->
            <div class="bg-[#161616] p-3 rounded-lg flex justify-between items-center border border-stone-800">
                <span class="text-stone-300 font-medium text-sm">الهندسة المعمارية (موازي)</span>
                <button class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white text-xs font-bold px-2.5 py-1 rounded transition">حذف</button>
            </div>

            <!-- زر التثبيت الأخضر -->
            <button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg text-sm transition">
                تثبيت الرغبات
            </button>
        </div>

        <!-- صندوق عرض الأفرع المتاحة للفرز والإضافة -->
        <div class="space-y-3">
            <h3 class="text-sm font-bold text-stone-400 border-b border-stone-800 pb-2">الأفرع والخيارات المتوافقة:</h3>
            
            <div id="branchesContainer" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <!-- عينة مسبقة للشكل الكلاسيكي للفرع قبل البحث لكي ترى الهيكل -->
                <div class="bg-[#242424] p-3 rounded-xl flex justify-between items-center border border-stone-800">
                    <button class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 transition shadow-sm">
                        <span>+</span> إضافة
                    </button>
                    <span class="text-emerald-500 font-bold text-sm bg-emerald-500/10 px-2 py-0.5 rounded-md">%72</span>
                    <div class="text-left">
                        <h4 class="font-bold text-sm text-stone-200">الهندسة المعمارية</h4>
                        <p class="text-xs text-stone-400">جامعة دمشق | موازي</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- جافا سكريبت مدمجة للربط والتحليل الديناميكي مع الباك إند -->
    <script>
        document.getElementById('mofadhalaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            
            fetch('/analyze', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(res => {
                const container = document.getElementById('branchesContainer');
                container.innerHTML = '';
                
                if (res.status === 'success' && res.data.length > 0) {
                    res.data.forEach(branch => {
                        const card = `
                            <div class="bg-[#242424] p-3 rounded-xl flex justify-between items-center border border-stone-800 transition hover:border-stone-700">
                                <button class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition shadow-sm">
                                    + إضافة
                                </button>
                                <span class="text-emerald-500 font-bold text-sm bg-emerald-500/10 px-2 py-0.5 rounded-md">%${branch.min_score}</span>
                                <div class="text-left">
                                    <h4 class="font-bold text-sm text-stone-200">${branch.name}</h4>
                                    <p class="text-xs text-stone-400">${branch.university} | ${branch.type}</p>
                                </div>
                            </div>
                        `;
                        container.innerHTML += card;
                    });
                } else {
                    container.innerHTML = '<p class="text-center text-xs text-red-400 py-4">لا توجد أفرع متوافقة مع هذا المعدل حالياً.</p>';
                }
            });
        });
    </script>
</body>
</html>
