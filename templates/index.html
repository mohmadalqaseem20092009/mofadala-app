<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاضلة القبول الجامعي</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: start;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            position: relative;
            margin-bottom: 24px;
        }
        .badge-top {
            position: absolute;
            left: 0;
            top: 0;
            background-color: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }
        .header h1 {
            color: #10b981;
            font-size: 20px;
            margin: 0;
        }
        .header p {
            color: #a0a0a0;
            font-size: 13px;
            margin: 4px 0 0 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        .form-group input, .form-group select {
            width: 100%;
            box-sizing: border-box;
            background-color: #121212;
            border: 1px solid #404040;
            border-radius: 8px;
            padding: 12px;
            color: #ffffff;
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #10b981;
        }
        .wishes-container {
            border: 1px dashed #0284c7;
            background-color: rgba(2, 132, 199, 0.05);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .wishes-header {
            color: #38bdf8;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 12px;
            text-align: right;
        }
        .wish-row {
            background-color: #121212;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .delete-btn {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }
        .action-btn {
            width: 100%;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background-color: #059669;
        }
        .available-title {
            font-size: 13px;
            color: #888;
            margin: 20px 0 10px 0;
            text-align: right;
        }
        .branch-list {
            max-height: 240px;
            overflow-y: auto;
        }
        .branch-item {
            background-color: #121212;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .branch-details {
            text-align: right;
        }
        .branch-name {
            font-weight: bold;
            color: #e0e0e0;
        }
        .branch-sub {
            color: #888;
            font-size: 11px;
            margin-top: 2px;
        }
        .branch-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .min-score {
            color: #10b981;
            font-weight: bold;
        }
        .add-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .add-btn:hover {
            background-color: #1d4ed8;
        }
        .hidden {
            display: none !important;
        }
        .download-btn {
            display: inline-block;
            background-color: #0284c7;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header">
            <div class="badge-top">☀️ مشرق</div>
            <h1>مفاضلة القبول الجامعي</h1>
            <p>المهندس محمد القاسم</p>
        </div>

        <div class="form-group">
            <label>أدخل مجموعك المئوي (%):</label>
            <input type="number" id="studentScore" value="73" step="0.1" oninput="searchBranches()">
        </div>

        <div class="form-group">
            <label>نوع المفاضلة:</label>
            <select id="competitionType" onchange="searchBranches()">
                <option value="all">كل المفاضلات (عام وموازي)</option>
                <option value="عام">عام</option>
                <option value="موازي" selected>موازي</option>
            </select>
        </div>

        <!-- صندوق الرغبات المختارة -->
        <div id="wishesBox" class="wishes-container hidden">
            <div class="wishes-header">📋 رغباتك المختارة:</div>
            <div id="selectedWishesList"></div>
            <button onclick="submitWishes()" class="action-btn">تثبيت</button>
            <div id="downloadArea" class="hidden" style="text-align: center;"></div>
        </div>

        <!-- الأفرع المتاحة -->
        <div class="available-title">الأفرع المتاحة لمجموعك:</div>
        <div id="availableBranches" class="branch-list"></div>

    </div>

    <script>
        const DATA = [
            {"faculty": "السنة التحضيرية للكليات الطبية", "university": "جميع الجامعات الحكومية", "type": "عام", "min_score": 94.5},
            {"faculty": "السنة التحضيرية للكليات الطبية", "university": "جميع الجامعات الحكومية", "type": "موازي", "min_score": 92.0},
            {"faculty": "الهندسة المعلوماتية", "university": "جامعة دمشق", "type": "عام", "min_score": 85.0},
            {"faculty": "الهندسة المعلوماتية", "university": "جامعة دمشق", "type": "موازي", "min_score": 80.0},
            {"faculty": "الهندسة المعلوماتية", "university": "جامعة حلب", "type": "عام", "min_score": 84.0},
            {"faculty": "الهندسة المعلوماتية", "university": "جامعة حلب", "type": "موازي", "min_score": 79.0},
            {"faculty": "الهندسة الطبية", "university": "جامعة دمشق", "type": "عام", "min_score": 80.0},
            {"faculty": "الهندسة الطبية", "university": "جامعة دمشق", "type": "موازي", "min_score": 77.0},
            {"faculty": "الهندسة المعمارية", "university": "جامعة دمشق", "type": "عام", "min_score": 75.0},
            {"faculty": "الهندسة المعمارية", "university": "جامعة دمشق", "type": "موازي", "min_score": 72.0},
            {"faculty": "الهندسة المدنية", "university": "جامعة إدلب", "type": "عام", "min_score": 72.0},
            {"faculty": "الهندسة المدنية", "university": "جامعة حلب", "type": "موازي", "min_score": 67.0},
            {"faculty": "الهندسة المدنية", "university": "جامعة إدلب", "type": "موازي", "min_score": 65.0},
            {"faculty": "هندسة الميكاترونيك", "university": "جامعة حلب", "type": "عام", "min_score": 72.0},
            {"faculty": "هندسة الميكاترونيك", "university": "جامعة حلب", "type": "موازي", "min_score": 68.0},
            {"faculty": "هندسة الهمك (ميكانيك عام / كهرباء)", "university": "جميع الجامعات الحكومية", "type": "عام", "min_score": 68.0},
            {"faculty": "هندسة الهمك (ميكانيك عام / كهرباء)", "university": "جميع الجامعات الحكومية", "type": "موازي", "min_score": 64.0},
            {"faculty": "كلية الاقتصاد", "university": "جامعة دمشق", "type": "عام", "min_score": 68.0},
            {"faculty": "كلية الحقوق", "university": "جامعة دمشق", "type": "عام", "min_score": 55.0}
        ];

        let selectedWishes = [];

        function searchBranches() {
            const score = parseFloat(document.getElementById('studentScore').value);
            const type = document.getElementById('competitionType').value;
            const container = document.getElementById('availableBranches');
            container.innerHTML = '';

            if (isNaN(score)) return;

            let filtered = DATA.filter(branch => {
                if (score < branch.min_score) return false;
                if (type !== 'all' && type !== branch.type) return false;
                if (selectedWishes.some(w => w.faculty === branch.faculty && w.type === branch.type && w.university === branch.university)) return false;
                return true;
            });

            filtered.sort((a, b) => b.min_score - a.min_score);

            if (filtered.length === 0) {
                container.innerHTML = `<p style="text-align:center; font-size:12px; color:#666; padding:10px;">لا توجد أفرع متاحة للمجموع الحالي.</p>`;
                return;
            }
