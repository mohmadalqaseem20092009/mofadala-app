<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاضلة القبول الجامعي | المهندس محمد القاسم</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* تصميم هيكلي بسيط جداً متموضع في المنتصف */
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #ffffff;
            color: #333333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        .section-title {
            color: #3b5323; /* لون زيتي للعنوان */
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666666;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .input-field {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
        }

        .btn-submit {
            width: 100%;
            background-color: #3b5323; /* أزرار زيتية */
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #283818;
        }

        .results-box {
            width: 100%;
            max-width: 400px;
            margin-top: 30px;
            text-align: right;
        }

        .result-item {
            padding: 10px;
            border-bottom: 1px solid #eeeeee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-add {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1 class="section-title">مفاضلة القبول الجامعي</h1>
        <p class="subtitle">المهندس محمد القاسم</p>

        <!-- استمارات الإدخال الهيكلية العادية -->
        <form id="mofadhalaForm">
            <div style="text-align: right;">
                <label>اسم الطالب الثلاثي:</label>
                <input type="text" id="studentName" name="student_name" class="input-field" placeholder="أدخل الاسم">
            </div>

            <div style="text-align: right;">
                <label>أدخل مجموعك المئوي (%):</label>
                <input type="number" step="0.01" id="score" name="score" class="input-field" placeholder="مثال: 73" required>
            </div>

            <button type="submit" class="btn-submit">تحليل درجاتي وعرض الأفرع</button>
        </form>
    </div>

    <!-- صندوق عرض النتائج البسيط تحت الاستمارة مباشرة -->
    <div class="results-box">
        <h3 style="border-b: 2px solid #3b5323; padding-bottom: 5px; color: #3b5323;">الأفرع المتوافقة:</h3>
        <div id="branchesContainer">
            <!-- سيتم تعبئة البيانات هنا تلقائياً بدون أي تعقيد وتكون في المنتصف -->
        </div>
    </div>

    <script>
        document.getElementById('mofadhalaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            
            fetch('/analyze', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(res => {
                const container = document.getElementById('branchesContainer');
                container.innerHTML = '';
                
                if (res.status === 'success' && res.data.length > 0) {
                    res.data.forEach(branch => {
                        const item = `
                            <div class="result-item">
                                <button class="btn-add">+ إضافة</button>
                                <span style="font-weight:bold; color:#3b5323;">%${branch.min_score}</span>
                                <div>
                                    <strong style="font-size:14px;">${branch.name}</strong><br>
                                    <span style="font-size:12px; color:#666;">${branch.university} | ${branch.type}</span>
                                </div>
                            </div>
                        `;
                        container.innerHTML += item;
                    });
                } else {
                    container.innerHTML = '<p style="color:red; text-align:center; font-size:14px;">لا توجد أفرع متوافقة.</p>';
                }
            });
        });
    </script>

</body>
</html>
