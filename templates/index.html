<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاضلة القبول الجامعي</title>
    <style>
        :root {
            --primary-color: #1e7e34;
            --secondary-color: #28a745;
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #dddddd;
            --text-title: #ffffff;
            --border-color: #333333;
        }
        [data-theme="light"] {
            --bg-body: #e9ecef;
            --bg-card: #ffffff;
            --text-main: #333333;
            --text-title: #111111;
            --border-color: #dee2e6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.2s ease, color 0.2s ease; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; position: relative; }
        .theme-toggle-btn {
            position: absolute; top: 20px; left: 15px;
            background: var(--bg-card); border: 2px solid var(--border-color);
            color: var(--text-main); padding: 6px 12px; border-radius: 20px;
            cursor: pointer; font-weight: bold; z-index: 10; font-size: 0.9rem;
        }
        .main-card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: var(--bg-card); padding: 30px; margin-top: 45px; }
        .text-center { text-align: center; }
        .mb-4 { margin-bottom: 1.5rem; }
        .mb-3 { margin-bottom: 1rem; }
        .form-label { display: block; margin-bottom: .5rem; font-weight: bold; text-align: right; }
        .form-control, .form-select { display: block; width: 100%; padding: .6rem; font-size: 1.1rem; background-color: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); border-radius: .25rem; text-align: center; outline: none; }
        
        .btn-analyze { display: block; width: 100%; background-color: var(--primary-color); color: white; border: none; padding: 14px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 20px; margin-bottom: 20px; }
        .btn-analyze:hover { background-color: #155d27; }
        
        .faculty-card { background: var(--bg-card); border-right: 5px solid var(--secondary-color); border-left: 1px solid var(--border-color); border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); border-radius: 8px; padding: 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .btn-add-wish { background-color: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-add-wish:hover { background-color: #0056b3; }
        .search-box { display: none; margin-top: 20px; border-top: 2px solid var(--border-color); padding-top: 20px; }
        
        .wishlist-container { display: none; margin-top: 30px; margin-bottom: 20px; border: 2px dashed #007bff; border-radius: 10px; padding: 20px; text-align: right; }
        .wish-item { background: var(--bg-card); padding: 10px; border-radius: 5px; margin-bottom: 8px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .btn-remove-wish { background: #dc3545; color: white; border: none; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-submit-excel { display: block; width: 100%; background-color: var(--secondary-color); color: white; border: none; padding: 14px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn-submit-excel:hover { background-color: #1e7e34; }
        
        .engineer-title { color: #6c757d; font-weight: bold; font-size: 1.1rem; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">🌙 مطلع</button>

    <div class="main-card">
        <div class="text-center mb-4">
            <h2 style="color: var(--primary-color);" class="mb-2">مفاضلة القبول الجامعي</h2>
            <div class="engineer-title">المهندس محمد القاسم</div>
        </div>

        <div class="mb-3">
            <label class="form-label">اسم الطالب الثلاثي:</label>
            <input type="text" id="studentNameInput" class="form-control" placeholder="اكتب اسم الطالب هنا..." style="text-align: center;">
        </div>

        <div class="mb-3">
            <label class="form-label">أدخل مجموعك المئوي (%):</label>
            <input type="number" step="0.01" id="scoreInput" class="form-control" placeholder="مثال: 73" required>
        </div>

        <button type="button" class="btn-analyze" onclick="processAnalysis()">تحليل درجاتي وعرض الأفرع ✨</button>

        <div class="wishlist-container" id="wishlistContainer">
            <h4 style="color: #007bff; margin-bottom: 15px; text-align: right;">📋 رغباتك المختارة:</h4>
            <div id="wishlistWrapper"></div>
            <button class="btn-submit-excel" onclick="submitWishesToExcel()">تثبيت</button>
        </div>

        <div class="search-box" id="searchBoxContainer">
            <div id="resultsCount" style="font-weight: bold; margin-bottom: 15px; color: var(--primary-color); text-align: right;">الأفرع المتاحة لمجموعك:</div>
            <div id="resultsWrapper"></div>
        </div>
    </div>
</div>

<script>
    var localData = [
        {"faculty": "السنة التحضيرية الطبية", "university": "جميع الجامعات", "type": "عام", "min_score": 94.5},
        {"faculty": "السنة التحضيرية الطبية", "university": "جميع الجامعات", "type": "موازي", "min_score": 92.0},
        {"faculty": "الهندسة المعلوماتية", "university": "جامعة دمشق", "type": "عام", "min_score": 85.0},
        {"faculty": "الهندسة المعلوماتية", "university": "جامعة دمشق", "type": "موازي", "min_score": 80.0},
        {"faculty": "الهندسة المعلوماتية", "university": "جامعة حلب", "type": "عام", "min_score": 84.0},
        {"faculty": "الهندسة المعلوماتية", "university": "جامعة حلب", "type": "موازي", "min_score": 79.0},
        {"faculty": "الهندسة الطبية", "university": "جامعة دمشق", "type": "عام", "min_score": 80.0},
        {"faculty": "الهندسة الطبية", "university": "جامعة دمشق", "type": "موازي", "min_score": 77.0},
        {"faculty": "الهندسة المعمارية", "university": "جامعة دمشق", "type": "عام", "min_score": 75.0},
        {"faculty": "الهندسة المعمارية", "university": "جامعة دمشق", "type": "موازي", "min_score": 72.0},
        {"faculty": "الهندسة المدنية", "university": "جامعة دمشق", "type": "عام", "min_score": 80.0},
        {"faculty": "الهندسة المدنية", "university": "جامعة دمشق", "type": "موازي", "min_score": 74.0},
        {"faculty": "هندسة الميكاترونيك", "university": "جامعة حلب", "type": "عام", "min_score": 72.0},
        {"faculty": "هندسة الميكاترونيك", "university": "جامعة حلب", "type": "موازي", "min_score": 68.0},
        {"faculty": "هندسة الهمك (ميكانيك/كهرباء)", "university": "جميع الجامعات", "type": "عام", "min_score": 68.0},
        {"faculty": "هندسة الهمك (ميكانيك/كهرباء)", "university": "جميع الجامعات", "type": "موازي", "min_score": 64.0},
        {"faculty": "كلية الاقتصاد", "university": "جامعة دمشق", "type": "عام", "min_score": 68.0},
        {"faculty": "كلية الحقوق", "university": "جامعة دمشق", "type": "عام", "min_score": 55.0}
    ];

    var rawData = [];
    var selectedWishes = []; 

    function toggleTheme() {
        var body = document.documentElement;
        var btn = document.getElementById('themeBtn');
        if (body.getAttribute('data-theme') === 'light') {
            body.removeAttribute('data-theme');
            btn.innerText = '🌙 مطلع';
        } else {
            body.setAttribute('data-theme', 'light');
            btn.innerText = '☀️ مشرق';
        }
    }

    function processAnalysis() {
        var scoreVal = document.getElementById('scoreInput').value;
        var searchBox = document.getElementById('searchBoxContainer');
        var wrapper = document.getElementById('resultsWrapper');
        
        if (!scoreVal) { alert('الرجاء إدخال المجموع أولاً!'); return; }
        
        var score = parseFloat(scoreVal);
        searchBox.style.display = 'block';
        wrapper.innerHTML = '';

        rawData = localData.filter(function(item) {
            return score >= item.min_score;
        });

        rawData.sort(function(a, b) { return b.min_score - a.min_score; });
        document.getElementById('resultsCount').innerText = 'الأفرع المتاحة لمجموعك الحقيقي:';

        if (rawData.length === 0) {
            wrapper.innerHTML = '<div style="text-align:center; color:#856404; padding:15px; background:#fff3cd; border-radius:5px; font-weight:bold;">لم نجد نتائج متوافقة مع هذا المجموع.</div>';
            return;
        }

        // تم تصحيح سطر حلقة الفرز هنا ليعمل بنجاح دون أي تجميد
        rawData.forEach(function(item, index) {
            var card = document.createElement('div');
            card.className = 'faculty-card';
            
            var textDiv = document.createElement('div');
            textDiv.style.textAlign = 'right';
            textDiv.style.flex = '1';
            
            var title = document.createElement('h3');
            title.style.color = 'var(--text-title)';
            title.style.fontSize = '1.1rem';
            title.style.fontWeight = 'bold';
            title.style.marginBottom = '5px';
            title.innerText = item.faculty;
            
            var smallInfo = document.createElement('small');
            smallInfo.style.color = '#6c757d';
            smallInfo.innerText = item.university + ' | ' + item.type;
            
            textDiv.appendChild(title);
            textDiv.appendChild(smallInfo);
