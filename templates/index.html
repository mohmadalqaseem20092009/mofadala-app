<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الرغبات - مفاضلة القبول</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: start;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2d2d2d;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }
        .header-title h1 {
            margin: 0;
            font-size: 22px;
            color: #ffffff;
        }
        .header-title p {
            margin: 4px 0 0 0;
            font-size: 12px;
            color: #a0a0a0;
        }
        .cancel-btn {
            background-color: rgba(127, 29, 29, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .filter-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            background-color: #151515;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #2d2d2d;
            margin-bottom: 20px;
        }
        @media (max-width: 480px) {
            .filter-box { grid-template-columns: 1fr; }
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 12px;
            color: #a0a0a0;
            text-align: right;
        }
        .form-group input, .form-group select {
            background-color: #1e1e1e;
            border: 1px solid #404040;
            border-radius: 8px;
            padding: 10px;
            color: #ffffff;
            font-size: 15px;
            text-align: center;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #06b6d4;
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid #2d2d2d;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #a0a0a0;
            padding: 12px 0;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .tab-btn.active {
            border-bottom: 3px solid #06b6d4;
            color: #06b6d4;
        }
        .badge {
            background-color: #2d2d2d;
            color: #e0e0e0;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-right: 6px;
        }
        .branch-card {
            background-color: #1a1a1a;
            border: 1px solid #2d2d2d;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            text-align: right;
        }
        .branch-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .branch-title {
            font-weight: bold;
            color: #ffffff;
            font-size: 14px;
        }
        .branch-meta {
            font-size: 12px;
            color: #a0a0a0;
        }
        .branch-score {
            font-size: 12px;
            color: #f59e0b;
            font-weight: 500;
        }
        .add-btn {
            background-color: #0e7490;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .add-btn:hover { background-color: #0891b2; }
        .remove-btn {
            background: none;
            border: none;
            color: #f87171;
            cursor: pointer;
            font-size: 12px;
        }
        .wish-item {
            background-color: #1a1a1a;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            text-align: right;
        }
        .wish-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .wish-number {
            background-color: #0f172a;
            color: #38bdf8;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 13px;
            border: 1px solid #1e3a8a;
        }
        .submit-section {
            border-top: 1px solid #2d2d2d;
            padding-top: 16px;
            margin-top: 20px;
        }
        .submit-btn {
            width: 100%;
            background-color: #b91c1c;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .submit-btn:hover { background-color: #dc2626; }
        .hidden { display: none !important; }
        .scroll-container { max-height: 380px; overflow-y: auto; padding-right: 4px; }
        .download-link {
            display: inline-block;
            background-color: #059669;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- الهيدر العلوي -->
        <div class="header-section">
            <div class="header-title">
                <h1>إدارة الرغبات</h1>
                <p>أضف رغباتك، رتّبها حسب أولويتك، ثم ثبّتها عند الانتهاء.</p>
            </div>
            <button class="cancel-btn">🔓 طلب إلغاء التثبيت</button>
        </div>

        <!-- حقول الاختيارات والتصفية -->
        <div class="filter-box">
            <div class="form-group">
                <label>أدخل مجموعك المئوي (%):</label>
                <input type="number" id="studentScore" value="85" step="0.1" oninput="searchBranches()">
            </div>
            <div class="form-group">
                <label>تحديد نوع المفاضلة:</label>
                <select id="competitionType" onchange="searchBranches()">
                    <option value="all">كل المفاضلات (عام وموازي)</option>
                    <option value="عام" selected>علمي عام</option>
                    <option value="موازي">علمي موازي</option>
                </select>
            </div>
        </div>

        <!-- أزرار التنقل -->
        <div class="tabs">
            <button onclick="switchTab('search')" id="tabSearch" class="tab-btn active">➕ إضافة رغبة</button>
            <button onclick="switchTab('wishes')" id="tabWishes" class="tab-btn">📋 رغباتي <span id="wishesBadge" class="badge">0</span></button>
        </div>

        <!-- صفحة 1: إضافة رغبة -->
        <div id="pageSearch">
            <div id="availableBranches" class="scroll-container"></div>
        </div>

        <!-- صفحة 2: رغباتي -->
        <div id="pageWishes" class="hidden">
            <div id="selectedWishesList"></div>

            <div class="submit-section">
                <button onclick="submitWishes()" id="submitBtn" class="submit-btn">
                    🔒 تثبيت الرغبات (إرسال إكسل)
                </button>
            </div>
            
            <div id="downloadArea" class="hidden" style="text-align: center;"></div>
        </div>

    </div>
